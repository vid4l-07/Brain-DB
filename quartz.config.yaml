# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Brain DB
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true
  analytics:
    provider: plausible 
  locale: en-US
  baseUrl: vid4l-07.github.io/Brain-DB
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      title: Mononoki
      header: Mononoki
      body: Space Grotesk
      code: Mononoki
    colors:
      lightMode:
        light: "#f2f1f5"
        darker: #f2f1f5
        lightgray: "#e5e9f0"
        gray: "#c4c2cd"
        darkgray: "#4a4950"
        dark: "#4a4950"
        secondary: "#7090b0"
        tertiary: "#8c72b0"
        highlight: rgba(115, 122, 126, 0.15)
        textHighlight: "#c85d6588"
        shadow: rgba(100,100,100,0.21)
        selection_bg: "#222630"
        selection_fg: "#81a1c1" 

      darkMode:
        light: "#191D24"
        darker: "#1e222a"
        lightgray: "#242933"
        gray: "#2e3440"
        darkgray: "#d8dee9"
        dark: "#e5e9f0"
        secondary: "#d08770"
        tertiary: "#ebcb8b"
        highlight: rgba(88, 82, 96, 0.15)
        textHighlight: "#924f5888"
        shadow: rgba(0,0,0,0.21)
        selection_bg: "#81a1c1" 
        selection_fg: "#222630"

        # secondary: "#81a1c1"
        # tertiary: "#b1c89d"
        # selection_bg: "#d8dee9" 

plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
    order: 10

  - source: ./my-plugins/created-date-strict
    enabled: true
    order: 11

  - source: github:quartz-community/syntax-highlighting
    enabled: true  # Enable the community one too 
    options:
      theme:
        light: catppuccin-macchiato # catppuccin-latte
        dark:  catppuccin-macchiato
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40

  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
    order: 60

  - source: github:quartz-community/description
    enabled: true
    order: 70

  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45

  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json

  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true

  - source: ./my-plugins/folder-page
    enabled: true
  - source: ./my-plugins/tag-page
    enabled: true

# Top nav / toolbar
  - source: ./my-plugins/top-folders
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      group: top-nav
      groupOptions:
        grow: true
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      group: top-nav
  - source: github:quartz-community/darkmode
    enabled: false
    layout:
      position: beforeBody
      priority: 30
      group: top-nav
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: beforeBody
      priority: 40
      group: top-nav
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: beforeBody
      priority: 50
      group: top-nav

# Files
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
      display: desktop-only
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: desktop-only
  # - source: github:quartz-community/table-of-contents
  - source: ./my-plugins/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 40
      display: desktop-only

  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 55
      condition: not-index
      group: page-name
      groupOptions:
        grow: true

  - source: github:quartz-community/content-meta
    enabled: false
    layout:
      position: beforeBody
      priority: 70
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 80
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 60
      condition: not-index
      group: page-name
    options:
      spacerSymbol: "/"
      rootName: "~"

  - source: ./my-plugins/recent-notes
    enabled: true
    layout:
      position: afterBody
      priority: 100
      condition: is-index
    options:
      title: Publicaciones recientes
      limit: 7
      showTags: true
      hideTagPages: true
      hideFolderPages: true

  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all


layout:
  groups:
    top-nav:
      priority: 10
      direction: row
      gap: 1rem
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
    page-name:
      priority: 40
      direction: row
    header:
      priority: 10
      direction: row
    topbar:
      priority: 15
      direction: row
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      positions:
        left: []
    folder:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        left: []
        right: []
    canvas:
      positions:
        left: []
    bases:
      positions:
        left: []
